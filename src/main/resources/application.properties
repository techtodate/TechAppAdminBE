spring.config.import=optional:file:.env[.properties]
server.port=8082

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.environment=${RAZORPAY_ENVIRONMENT:TEST}
razorpay.route.test-account-creation-enabled=${RAZORPAY_ROUTE_TEST_ACCOUNT_CREATION_ENABLED:false}
training.settlement.route-enabled=${RAZORPAY_ROUTE_ENABLED:false}

spring.application.name=techtodate-admin

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/Basicwebapp}
spring.datasource.username=musthafa
spring.datasource.password=India@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jackson.property-naming-strategy=SNAKE_CASE

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.jwt-secret=${ADMIN_JWT_SECRET:}
app.admin.access-token-minutes=${ADMIN_ACCESS_TOKEN_MINUTES:15}
app.admin.refresh-token-days=${ADMIN_REFRESH_TOKEN_DAYS:14}
# Azure Blob Storage is the single topic-image store. Both backends must use
# Azure Blob Storage
media.storage.provider=azure

media.storage.azure.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
media.storage.azure.container=${AZURE_STORAGE_CONTAINER:public-media}
media.public-base-url=${AZURE_STORAGE_PUBLIC_BASE_URL:}

# Upload processing limits
media.topic-image-max-upload-bytes=2097152
media.max-pixel-count=40000000
media.image.thumb-width=160
media.image.small-width=480
media.image.medium-width=960

spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB


